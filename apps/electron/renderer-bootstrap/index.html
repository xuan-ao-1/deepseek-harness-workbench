<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>DeepSeek Harness Workbench</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #ffffff;
      color: #1a1a1a;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .titlebar {
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 0 0 12px;
      background: #ffffff;
      border-bottom: 1px solid #e5e5e5;
      flex-shrink: 0;
      -webkit-app-region: drag;
      user-select: none;
    }

    .titlebar-title {
      font-size: 12px;
      font-weight: 400;
      color: #333333;
    }

    .window-controls {
      display: flex;
      height: 100%;
      -webkit-app-region: no-drag;
    }

    .window-controls button {
      width: 46px;
      height: 100%;
      border: none;
      background: transparent;
      color: #333333;
      cursor: default;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.08s ease, color 0.08s ease;
      -webkit-app-region: no-drag;
      outline: none;
      padding: 0;
      margin: 0;
      border-radius: 0;
    }

    .window-controls button:hover {
      background: rgba(0, 0, 0, 0.06);
      color: #000000;
    }

    .window-controls button:active {
      background: rgba(0, 0, 0, 0.1);
      color: #000000;
    }

    .window-controls button.close:hover {
      background: #e81123;
      color: #ffffff;
    }

    .window-controls button.close:active {
      background: #c42b1c;
      color: #ffffff;
    }

    .window-controls svg {
      width: 11px;
      height: 11px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .content {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: auto;
      -webkit-app-region: no-drag;
      background: #ffffff;
    }

    .box {
      max-width: 560px;
      padding: 40px 44px;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      background: #fafafa;
    }

    h1 { font-size: 18px; margin: 0 0 12px; font-weight: 600; color: #1a1a1a; }
    p { color: #555555; font-size: 13px; line-height: 1.7; margin: 0 0 8px; }
    code { color: #0066cc; font-size: 12px; background: #f0f0f0; padding: 2px 5px; border-radius: 3px; font-family: "Cascadia Code", "Consolas", monospace; }
  </style>
</head>
<body>
  <div class="titlebar">
    <div class="titlebar-title">DeepSeek Harness Workbench</div>
    <div class="window-controls">
      <button id="btn-minimize" title="最小化" aria-label="最小化">
        <svg viewBox="0 0 12 12"><line x1="2.5" y1="6" x2="9.5" y2="6"/></svg>
      </button>
      <button id="btn-maximize" title="最大化" aria-label="最大化">
        <svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="0.8"/></svg>
      </button>
      <button id="btn-close" class="close" title="关闭" aria-label="关闭">
        <svg viewBox="0 0 12 12"><line x1="3.2" y1="3.2" x2="8.8" y2="8.8"/><line x1="8.8" y1="3.2" x2="3.2" y2="8.8"/></svg>
      </button>
    </div>
  </div>
  <div class="content">
    <div class="box">
      <h1>DeepSeek Harness Workbench</h1>
      <p>Renderer 占位页。正式 UI 为官方 Client Shell：</p>
      <p>Phase 0 由 <code>dsh web</code> 提供（loopback）；M2 起为官方 RPC over Electron IPC carrier。本页仅在运行时未接入时显示。</p>
      <p>当前项目状态见仓库内 <code>docs/STATUS.md</code>。</p>
    </div>
  </div>
  <script>
    (function() {
      var api = window.workbenchWindow;
      var btnMin = document.getElementById("btn-minimize");
      var btnMax = document.getElementById("btn-maximize");
      var btnClose = document.getElementById("btn-close");

      function updateMaxIcon(isMaximized) {
        btnMax.innerHTML = isMaximized
          ? '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="6.5" height="6.5" rx="0.8"/><path d="M8 3.7V2.5H2.5V8H3.7"/></svg>'
          : '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="2.5" width="7" height="7" rx="0.8"/></svg>';
        btnMax.title = isMaximized ? "还原" : "最大化";
      }

      btnMin.addEventListener("click", function() { api.minimize(); });
      btnMax.addEventListener("click", function() { api.maximizeToggle(); });
      btnClose.addEventListener("click", function() { api.close(); });

      api.isMaximized().then(updateMaxIcon);
      api.onMaximizedChange(updateMaxIcon);
    })();
  </script>
</body>
</html>
